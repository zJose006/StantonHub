<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stanton Hub</title>
    <style>
      html{background:#050911;background-color:#050911;scrollbar-gutter:stable;overscroll-behavior-y:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:clip;overscroll-behavior-y:none;background:#050911;color:#eef8ff;font-family:Inter,"Segoe UI",system-ui,sans-serif}#root{min-height:100vh;overflow-x:clip;background:radial-gradient(circle at 18% 12%,rgba(0,217,255,.12),transparent 26%),radial-gradient(circle at 86% 16%,rgba(255,181,71,.08),transparent 22%),linear-gradient(180deg,#04070e 0%,#07111e 48%,#050911 100%);background-color:#050911}.boot-shell{min-height:100vh;background:linear-gradient(180deg,#04070e 0%,#07111e 48%,#050911 100%);background-color:#050911}.boot-hero{min-height:clamp(410px,42vw,500px);padding:1.5rem clamp(1rem,4vw,3rem) 5rem;background:radial-gradient(circle at 15% 10%,rgba(0,217,255,.14),transparent 30%),linear-gradient(145deg,rgba(4,9,18,.96),rgba(8,25,43,.92) 58%,rgba(5,9,17,.98));border-bottom:1px solid rgba(91,218,255,.24)}.boot-nav{width:min(1120px,100%);min-height:62px;margin:0 auto 4.8rem;border:1px solid rgba(91,218,255,.14);border-radius:8px;background:rgba(3,11,20,.34)}.boot-copy{width:min(1120px,100%);min-height:178px;margin:0 auto}.boot-reserve{width:min(1120px,calc(100% - 2rem));min-height:62vh;margin:-2.9rem auto 3rem}@media(max-width:900px){.boot-hero{min-height:350px;padding:.8rem .75rem 3.9rem}.boot-nav{min-height:76px;margin-bottom:2.8rem}.boot-copy{min-height:142px}.boot-reserve{min-height:64vh;margin-top:-2.25rem}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-shell"><div class="boot-hero"><div class="boot-nav"></div><div class="boot-copy"></div></div><div class="boot-reserve"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
