<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso - Star Citizen</title>
  <link rel="stylesheet" href="../Estilos/styles.css" />
</head>
<body data-page="login">
  <header class="hero hero-compact">
    <div class="hero-topbar">
      <a class="home-button" href="index.html" aria-label="Inicio">
        <span class="home-icon" aria-hidden="true">SC</span>
        Stanton Hub
      </a>
      <div class="page-buttons">
        <a class="page-btn" href="noticias.html">Intel</a>
        <a class="page-btn" href="guias.html">Gu&iacute;as</a>
        <a class="page-btn active" href="perfil.html">Perfil</a>
      </div>
    </div>

    <div class="hero-content">
      <span class="eyebrow">Acceso de piloto</span>
      <h1>Inicia sesi&oacute;n</h1>
      <p>Entra con tu email para publicar gu&iacute;as, rutas de farmeo y ayudas para otros pilotos.</p>
    </div>
  </header>

  <main class="container single-column">
    <section class="panel auth-panel">
      <div class="panel-header">
        <div>
          <span class="section-label">Terminal segura</span>
          <h2>Acceso</h2>
        </div>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          Email
          <input type="email" id="login-identifier" required maxlength="80" autocomplete="email" />
        </label>
        <label>
          Contrase&ntilde;a
          <input type="password" id="login-password" required maxlength="80" autocomplete="current-password" />
        </label>
        <p class="form-message" id="auth-message"></p>
        <button type="submit" class="submit-btn">Entrar</button>
      </form>

      <p class="auth-link">&iquest;No tienes cuenta? <a href="registro.html">Crear perfil de usuario</a></p>
    </section>
  </main>

  <script src="../Scripts/script.js"></script>
</body>
</html>
