<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor - Star Citizen</title>
  <link rel="stylesheet" href="../Estilos/styles.css" />
</head>
<body data-page="editor">
  <header class="hero hero-compact">
    <div class="hero-topbar">
      <a class="home-button" href="index.html" aria-label="Inicio">
        <span class="home-icon" aria-hidden="true">SC</span>
        Stanton Hub
      </a>
      <div class="page-buttons">
        <a class="page-btn" href="noticias.html">Intel</a>
        <a class="page-btn" href="guias.html">Gu&iacute;as</a>
        <a class="page-btn" href="perfil.html">Perfil</a>
      </div>
    </div>

    <div class="hero-content">
      <span class="eyebrow">Editor de contenido</span>
      <h1>Crea una publicaci&oacute;n</h1>
      <p>A&ntilde;ade t&iacute;tulo, im&aacute;genes y texto con formato para publicar una gu&iacute;a, mensaje de foro o intel.</p>
    </div>
  </header>

  <main class="container single-column editor-shell">
    <section class="panel editor-panel">
      <div class="panel-header">
        <div>
          <span class="section-label">Terminal de escritura</span>
          <h2 id="editor-heading">Nueva publicaci&oacute;n</h2>
        </div>
      </div>

      <form id="editor-form" class="editor-form">
        <div class="editor-field editor-field-section">
          <label for="editor-section">Tipo de publicaci&oacute;n</label>
          <select id="editor-section">
            <option value="forum">Foro</option>
            <option value="guides">Gu&iacute;a</option>
            <option value="news">Intel</option>
          </select>
        </div>

        <label class="editor-field">
          <span>T&iacute;tulo</span>
          <input type="text" id="editor-title" required maxlength="120" />
        </label>

        <div class="editor-toolbar" aria-label="Herramientas de formato">
          <div class="toolbar-group">
            <button type="button" data-command="bold" title="Negrita"><strong>B</strong></button>
            <button type="button" data-command="italic" title="Cursiva"><em>I</em></button>
            <button type="button" data-command="underline" title="Subrayado"><u>U</u></button>
            <button type="button" data-command="strikeThrough" title="Tachado">S</button>
          </div>
          <div class="toolbar-group">
            <button type="button" data-command="formatBlock" data-value="p">Texto</button>
            <button type="button" data-command="formatBlock" data-value="h2">H2</button>
            <button type="button" data-command="formatBlock" data-value="h3">H3</button>
            <button type="button" data-command="formatBlock" data-value="blockquote">Cita</button>
          </div>
          <div class="toolbar-group">
            <button type="button" data-command="insertUnorderedList">Lista</button>
            <button type="button" data-command="insertOrderedList">1. Lista</button>
            <button type="button" data-command="justifyLeft">Izq</button>
            <button type="button" data-command="justifyCenter">Centro</button>
            <button type="button" data-command="justifyRight">Der</button>
          </div>
          <div class="toolbar-group">
            <label class="toolbar-color">
              Color
              <input type="color" id="text-color" value="#00d9ff" />
            </label>
            <button type="button" id="insert-link-btn">Link</button>
            <button type="button" data-command="removeFormat">Limpiar</button>
          </div>
        </div>

        <label class="editor-field">
          <span>Contenido</span>
          <div id="rich-editor" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true"></div>
        </label>

        <label class="editor-field">
          <span>Im&aacute;genes</span>
          <input type="file" id="editor-images" accept="image/*" multiple />
        </label>
        <div class="image-preview" id="image-preview"></div>

        <p class="form-message" id="editor-message"></p>
        <button type="submit" class="submit-btn">Publicar</button>
      </form>
    </section>
  </main>

  <script src="../Scripts/editor.js"></script>
</body>
</html>
