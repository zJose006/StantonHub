<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Star Citizen</title>
  <link rel="stylesheet" href="../Estilos/styles.css" />
</head>
<body data-page="profile">
  <header class="hero hero-compact">
    <div class="hero-topbar">
      <a class="home-button" href="index.html" aria-label="Inicio">
        <span class="home-icon" aria-hidden="true">SC</span>
        Stanton Hub
      </a>
      <div class="page-buttons">
        <a class="page-btn" href="noticias.html">Intel</a>
        <a class="page-btn" href="guias.html">Gu&iacute;as</a>
        <a class="page-btn active" href="perfil.html">Perfil</a>
      </div>
    </div>

    <div class="hero-content">
      <span class="eyebrow">Panel de usuario</span>
      <h1>Perfil y permisos</h1>
      <p>Consulta tu estado de sesi&oacute;n, especialidad y acceso para publicar contenido en el hub.</p>
    </div>
  </header>

  <main class="container single-column">
    <section class="panel profile-page">
      <div class="profile-card profile-card-large">
        <div class="profile-avatar" id="profile-avatar">SC</div>
        <div>
          <span class="section-label">Username conectado</span>
          <h2 id="profile-name">Invitado</h2>
          <p id="profile-status">Inicia sesi&oacute;n para publicar gu&iacute;as, rutas y ayudas.</p>
        </div>
      </div>

      <div class="profile-metrics" id="profile-metrics"></div>
      <div class="profile-actions" id="profile-actions"></div>

      <label class="test-toggle">
        <input type="checkbox" id="test-bypass" />
        <span>Modo pruebas: permitir publicar sin registro</span>
      </label>
    </section>
  </main>

  <script src="../Scripts/script.js"></script>
</body>
</html>
